<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas de la casa</title>
<meta name="theme-color" content="#0f1530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Una sola "noche" azul profunda; cada servicio trae su propio color vivo. Grilla 2x2 de botones grandes + hoja inferior con los datos. */
  --bg:#0f1530;
  --bg2:#18204a;
  --ink:#f4f6ff;
  --muted:#a9b2d9;
  --line:rgba(255,255,255,.10);
  --sheet:#fbfbff;
  --sheet-ink:#151a33;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1200px 600px at 20% -10%, #2a3478 0%, transparent 60%),
             radial-gradient(900px 500px at 110% 10%, #3b1f6b 0%, transparent 55%),
             var(--bg);
  background-attachment:fixed;
  color:var(--ink);font-family:var(--body);
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:560px;margin:0 auto;
  padding:calc(22px + env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-direction:column;gap:6px}
.head{flex-direction:row;align-items:center;gap:14px}
.head>div{display:flex;flex-direction:column;gap:6px}
.dogs{flex:none;width:84px;height:84px;border-radius:24px;object-fit:cover;
  box-shadow:0 10px 24px -8px rgba(143,211,255,.45),0 0 0 3px rgba(255,255,255,.14)}
.hello{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;letter-spacing:-.5px;text-wrap:balance}
.hello span{background:linear-gradient(90deg,#ffd24a,#ff7ab6 55%,#8fd3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-weight:700;font-size:15px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tile{
  position:relative;overflow:hidden;border:0;cursor:pointer;text-align:left;
  min-height:200px;border-radius:28px;padding:16px 16px 14px;
  display:flex;flex-direction:column;justify-content:flex-end;gap:10px;
  color:#fff;font-family:var(--body);
  background:var(--g);
  box-shadow:0 14px 30px -12px var(--glow), inset 0 1px 0 rgba(255,255,255,.35);
  transition:transform .18s ease, box-shadow .18s ease;
}
.tile:active{transform:scale(.96)}
.tile:focus-visible{outline:3px solid #fff;outline-offset:3px}
.tile .art{position:absolute;right:-6px;top:-4px;width:112px;height:112px;opacity:.95;pointer-events:none}
.tile .name{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;text-shadow:0 2px 10px rgba(0,0,0,.18)}
.tile .co{font-weight:800;font-size:13px;opacity:.9}
.chip{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;
  background:rgba(0,0,0,.22);backdrop-filter:blur(6px);
  border-radius:999px;padding:6px 10px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.chip i{width:8px;height:8px;border-radius:50%;background:#bdf7c9;display:inline-block}
.chip.soon i{background:#ffd34d}
.chip.today i{background:#ff6b6b}

.t-luz{--g:linear-gradient(150deg,#ffd84d 0%,#ffa41b 55%,#ff7a00 100%);--glow:rgba(255,166,0,.65)}
.t-agua{--g:linear-gradient(150deg,#5ee4ff 0%,#2f8cff 55%,#1d4fe0 100%);--glow:rgba(47,140,255,.65)}
.t-gas{--g:linear-gradient(150deg,#ff8a7a 0%,#ff3d6e 55%,#c2187a 100%);--glow:rgba(255,61,110,.6)}
.t-vtr{--g:linear-gradient(150deg,#c89bff 0%,#8a4dff 55%,#5a2bd6 100%);--glow:rgba(138,77,255,.65)}

.sheetbtn{display:flex;align-items:center;gap:14px;text-decoration:none;color:#fff;
  border-radius:24px;padding:16px 18px;background:linear-gradient(135deg,#22c55e 0%,#16a34a 55%,#0f7a3a 100%);
  box-shadow:0 14px 28px -12px rgba(34,197,94,.6), inset 0 1px 0 rgba(255,255,255,.3)}
.sheetbtn:active{transform:scale(.98)}
.sheetbtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.sb-ic{flex:none;width:52px;height:52px;border-radius:16px;background:rgba(0,0,0,.18);display:grid;place-items:center}
.sb-tx{flex:1;display:flex;flex-direction:column;gap:2px}
.sb-tx b{font-family:var(--display);font-size:21px;line-height:1.1}
.sb-tx small{font-size:13px;font-weight:700;opacity:.9}
.tip{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid var(--line);
  border-radius:20px;padding:14px 16px;color:var(--muted);font-size:14px;line-height:1.45;font-weight:600}
.tip b{color:var(--ink)}
.tip svg{flex:none;margin-top:2px}

/* Hoja inferior */
.scrim{position:fixed;inset:0;background:rgba(6,9,25,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;
  max-width:560px;margin:0 auto;background:var(--sheet);color:var(--sheet-ink);
  border-radius:30px 30px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding-bottom:calc(18px + env(safe-area-inset-bottom));max-height:92%;overflow:auto}
.sheet.on{transform:translateY(0)}
.sh-top{position:relative;overflow:hidden;background:var(--g);color:#fff;border-radius:30px 30px 0 0;padding:14px 20px 22px;min-height:132px}
.grab{width:44px;height:5px;border-radius:9px;background:rgba(255,255,255,.7);margin:0 auto 12px}
.sh-top .art{position:absolute;right:6px;bottom:-14px;width:120px;height:120px;opacity:.9}
.sh-title{font-family:var(--display);font-weight:800;font-size:32px;line-height:1}
.sh-co{font-weight:800;opacity:.92;margin-top:4px}
.close{position:absolute;top:12px;right:14px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.2);color:#fff;font-size:20px;font-weight:800;cursor:pointer}
.close:focus-visible{outline:3px solid #fff}
.sh-body{padding:18px 20px 4px;display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#6b7194}
.numbox{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:#f0f2fb;border:2px dashed #cfd5f0;border-radius:18px;padding:12px 12px 12px 16px}
.num{font-family:var(--mono);font-weight:700;font-size:28px;letter-spacing:.5px;font-variant-numeric:tabular-nums;word-break:break-all}
.copy{flex:none;border:0;border-radius:14px;padding:12px 14px;background:#151a33;color:#fff;font-weight:800;font-family:var(--body);font-size:14px;cursor:pointer}
.copy.ok{background:#14a35a}
.copy:focus-visible,.go:focus-visible,.alt:focus-visible{outline:3px solid #3b5bff;outline-offset:2px}
.note{font-size:14px;line-height:1.45;color:#3b4166;font-weight:600}
.steps{list-style:none;display:flex;flex-direction:column;gap:8px;counter-reset:s}
.steps li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.4;font-weight:700;color:#2a2f52}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;
  display:grid;place-items:center;background:var(--g);color:#fff;font-size:13px;font-weight:800}
.go{display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
  border-radius:20px;padding:18px;background:var(--g);color:#fff;font-family:var(--display);font-weight:800;font-size:21px;
  box-shadow:0 12px 24px -10px var(--glow)}
.go:active{transform:scale(.98)}
.alt{display:block;text-align:center;color:#4a52a8;font-weight:800;font-size:14px;padding:6px;text-decoration:underline;text-underline-offset:3px}
.due{display:flex;justify-content:space-between;align-items:center;background:#f6f7fd;border-radius:16px;padding:12px 14px;font-weight:800;font-size:14.5px;font-variant-numeric:tabular-nums}
.due small{color:#6b7194;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;z-index:20;
  background:#14a35a;color:#fff;font-weight:800;padding:12px 18px;border-radius:999px;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){.tile .name{font-size:25px}.tile{min-height:180px}.hello{font-size:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <img class="dogs" src="perros.jpg" width="84" height="84" alt="Los dos huskies de la casa con un celular que dice Pagado">
    <div>
      <h1 class="hello">Cuentas de la <span>casa</span></h1>
      <p class="sub">Toca la cuenta que quieres pagar</p>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <a class="sheetbtn" href="https://docs.google.com/spreadsheets/d/1DipADL-64MCZWnWCGKgX-YkkbUc50XcGAPc2SY4ZRdk/edit?usp=drivesdk" target="_blank" rel="noopener">
    <span class="sb-ic"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3" y="2" width="18" height="20" rx="3" fill="#fff"/><path d="M7 8h10M7 12h10M7 16h10M12 8v8" stroke="#16a34a" stroke-width="2" stroke-linecap="round"/></svg></span>
    <span class="sb-tx"><b>Ver planilla de pagos</b><small>Marca lo pagado y anota cuánto salió</small></span>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>

  <div class="tip">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="#ffd24a" stroke-width="2"/><path d="M12 7v6M12 16.5v.5" stroke="#ffd24a" stroke-width="2.4" stroke-linecap="round"/></svg>
    <p>Dentro de cada cuenta, toca <b>Copiar</b> para llevarte el número y después <b>Ir a Unired</b>. Ahí lo pegas y aparece el monto a pagar.</p>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle"></section>
<div class="toast" id="toast" role="status">Número copiado ✓</div>

<script>
const ART = {
  luz:`<svg viewBox="0 0 120 120" aria-hidden="true"><g fill="none"><circle cx="60" cy="52" r="44" fill="rgba(255,255,255,.18)"/><path d="M60 22c-15 0-26 11-26 25 0 9 5 15 10 20 3 3 4 6 4 10h24c0-4 1-7 4-10 5-5 10-11 10-20 0-14-11-25-26-25z" fill="#fff"/><path d="M48 82h24M50 90h20M54 98h12" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M62 36l-10 16h10l-6 14" stroke="#ff9a00" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`,
  agua:`<svg viewBox="0 0 120 120" aria-hidden="true"><g fill="none"><circle cx="60" cy="56" r="44" fill="rgba(255,255,255,.18)"/><path d="M60 16C48 34 34 50 34 68a26 26 0 0052 0c0-18-14-34-26-52z" fill="#fff"/><path d="M48 70c0 8 5 13 12 14" stroke="#2f8cff" stroke-width="5" stroke-linecap="round"/><circle cx="92" cy="30" r="6" fill="#fff" opacity=".8"/><circle cx="24" cy="36" r="4" fill="#fff" opacity=".7"/></g></svg>`,
  gas:`<svg viewBox="0 0 120 120" aria-hidden="true"><g fill="none"><circle cx="60" cy="58" r="44" fill="rgba(255,255,255,.18)"/><path d="M62 14c4 16 26 26 26 50a28 28 0 01-56 0c0-12 6-20 12-26 0 10 4 16 10 18-2-16 2-30 8-42z" fill="#fff"/><path d="M60 98c-9 0-15-6-15-14 0-8 7-12 10-20 4 6 15 11 15 21 0 8-4 13-10 13z" fill="#ff3d6e"/></g></svg>`,
  vtr:`<svg viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="#fff" stroke-linecap="round"><circle cx="60" cy="60" r="44" fill="rgba(255,255,255,.18)" stroke="none"/><path d="M26 52a48 48 0 0168 0" stroke-width="8"/><path d="M38 65a31 31 0 0144 0" stroke-width="8"/><path d="M50 78a14 14 0 0120 0" stroke-width="8"/><circle cx="60" cy="90" r="5" fill="#fff" stroke="none"/></g></svg>`
};

const S = [
  {id:"luz", cls:"t-luz", name:"Luz", co:"Enel", label:"N° de cliente", num:"1429008-7", day:28,
   url:"https://www.unired.cl", cta:"Ir a Unired",
   steps:["En Unired toca “Agregar cuenta” y elige <b>Enel</b>.","Pega el número y aparece el monto.","Paga con tarjeta o transferencia."],
   alt:{url:"https://www.enel.cl", text:"Otra opción: página de Enel"}},
  {id:"agua", cls:"t-agua", name:"Agua", co:"Aguas Andinas", label:"N° de cuenta", num:"1084727-3", day:30,
   url:"https://www.unired.cl", cta:"Ir a Unired",
   steps:["En Unired toca “Agregar cuenta” y elige <b>Aguas Andinas</b>.","Pega el número y aparece el monto.","Paga con tarjeta o transferencia."],
   alt:{url:"https://www.aguasandinas.cl", text:"Otra opción: página de Aguas Andinas"}},
  {id:"gas", cls:"t-gas", name:"Gas", co:"Abastible", label:"N° de cliente", num:"7123651", day:19,
   url:"https://www.unired.cl", cta:"Ir a Unired",
   steps:["En Unired toca “Agregar cuenta” y elige <b>Abastible Boleta</b>.","Pega el número y aparece el monto.","Paga con tarjeta o transferencia."],
   alt:{url:"https://www.abastible.cl", text:"Otra opción: página de Abastible"}},
  {id:"vtr", cls:"t-vtr", name:"Internet", co:"Claro VTR", label:"Se entra con", num:"RUT del titular", day:16, noCopy:true,
   url:"https://pagoexpress.vtr.cl/PagoExpress/index", cta:"Ir a pagar a VTR",
   steps:["Se abre el Pago Express de Claro VTR.","Ingresa el RUT de Sofía (titular de la cuenta).","Marca la boleta vigente y toca <b>Pagar</b>."],
   alt:{url:"https://www.unired.cl", text:"Otra opción: pagar en Unired"}}
];

const MES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function nextDue(day){
  const t=new Date(); t.setHours(0,0,0,0);
  const mk=(y,m)=>{const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last));};
  let d=mk(t.getFullYear(),t.getMonth());
  if(d<t) d=mk(t.getFullYear(),t.getMonth()+1);
  const diff=Math.round((d-t)/864e5);
  return {d,diff};
}
function dueText(s){
  const {d,diff}=nextDue(s.day);
  const when = diff===0?"hoy":diff===1?"mañana":`en ${diff} días`;
  return {short:`Vence ${d.getDate()} ${MES[d.getMonth()]} · ${when}`, long:`${d.getDate()} de ${MES[d.getMonth()]}`, when, cls: diff===0?"today":diff<=5?"soon":""};
}

const grid=document.getElementById("grid");
S.forEach(s=>{
  const dt=dueText(s);
  const b=document.createElement("button");
  b.className="tile "+s.cls; b.type="button"; b.id="btn-"+s.id;
  b.setAttribute("aria-label",`Pagar ${s.name}, ${s.co}. ${dt.short}`);
  b.innerHTML=`<span class="art">${ART[s.id]}</span>
    <span style="margin-top:auto"><span class="name">${s.name}</span><br><span class="co">${s.co}</span></span>
    <span class="chip ${dt.cls}"><i></i>${dt.short}</span>`;
  b.addEventListener("click",()=>openSheet(s));
  grid.appendChild(b);
});

const sheet=document.getElementById("sheet"), scrim=document.getElementById("scrim"), toast=document.getElementById("toast");
let lastBtn=null;
async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select(); const ok=document.execCommand("copy"); ta.remove(); return ok; }
    catch(_){ return false; }
  }
}
function showToast(msg){ toast.textContent=msg; toast.classList.add("on"); clearTimeout(showToast.t); showToast.t=setTimeout(()=>toast.classList.remove("on"),1800); }

function openSheet(s){
  lastBtn=document.getElementById("btn-"+s.id);
  const dt=dueText(s);
  sheet.className="sheet "+s.cls;
  sheet.innerHTML=`
    <div class="sh-top">
      <div class="grab"></div>
      <button class="close" id="closeBtn" type="button" aria-label="Cerrar">×</button>
      <span class="art">${ART[s.id]}</span>
      <h2 class="sh-title" id="shTitle">${s.name}</h2>
      <div class="sh-co">${s.co}</div>
    </div>
    <div class="sh-body">
      <div>
        <div class="label">${s.label}</div>
        <div class="numbox" style="margin-top:6px">
          <span class="num" ${s.noCopy?'style="font-size:20px;font-family:var(--body);font-weight:800"':''}>${s.num}</span>
          ${s.noCopy?'':'<button class="copy" id="copyBtn" type="button">Copiar</button>'}
        </div>
      </div>
      <div class="due"><span>Próximo vencimiento</span><span>${dt.long} <small>· ${dt.when}</small></span></div>
      <ol class="steps">${s.steps.map(x=>`<li><span>${x}</span></li>`).join("")}</ol>
      <a class="go" id="goBtn" href="${s.url}" target="_blank" rel="noopener">${s.cta}
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    </div>`;
  scrim.classList.add("on"); sheet.classList.add("on");
  document.getElementById("closeBtn").addEventListener("click",closeSheet);
  const cb=document.getElementById("copyBtn");
  if(cb) cb.addEventListener("click",async()=>{ if(await copy(s.num)){cb.textContent="¡Copiado!";cb.classList.add("ok");showToast("Número copiado ✓");} else {cb.textContent="Mantén presionado el número";} });
  setTimeout(()=>document.getElementById("closeBtn").focus(),50);
}
function closeSheet(){ sheet.classList.remove("on"); scrim.classList.remove("on"); if(lastBtn) lastBtn.focus(); }
scrim.addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
let y0=null; sheet.addEventListener("touchstart",e=>{ if(sheet.scrollTop<=0) y0=e.touches[0].clientY; },{passive:true});
sheet.addEventListener("touchmove",e=>{ if(y0!==null && e.touches[0].clientY-y0>90){ y0=null; closeSheet(); } },{passive:true});
sheet.addEventListener("touchend",()=>{ y0=null; });
</script>
</body>
</html>
